[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookphoto"
version = "1.0.2"
description = "CLI pour une galerie photo privee serverless sur AWS (S3 + CloudFront), protegee par mot de passe."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastien Grazzini" }]
keywords = ["gallery", "photo", "aws", "s3", "cloudfront", "serverless"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
    "pillow>=11.0",
    "boto3[crt]>=1.34",
]

[project.urls]
Repository = "https://github.com/vikingen13/bookphoto-cli"
Issues = "https://github.com/vikingen13/bookphoto-cli/issues"

[project.scripts]
gallery = "bookphoto.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bookphoto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
