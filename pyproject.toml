[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookphoto"
version = "0.5.0"
description = "CLI pour une galerie photo privee serverless sur AWS (S3 + CloudFront), protegee par mot de passe."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sebastien Grazzini" }]
keywords = ["gallery", "photo", "aws", "s3", "cloudfront", "serverless"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
    "pillow>=11.0",
    "boto3[crt]>=1.34",
]

[project.scripts]
gallery = "bookphoto.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bookphoto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
